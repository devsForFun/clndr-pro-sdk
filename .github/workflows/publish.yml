name: Publish

# Publishes both packages to npm when a tag matching `v*` is pushed (e.g.
# `v0.2.1`), or from the Actions tab (Run workflow) to retry a release.
#
# Uses npm trusted publishing: npm trusts this workflow file through GitHub's
# OIDC token, so there's no NPM_TOKEN secret to expire, no 2FA prompt, and
# every release carries provenance. Each package needs this workflow added as
# a trusted publisher on npmjs.com once (see PUBLISHING.md § 2.3).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build --workspace @clndr-pro/sdk --workspace @clndr-pro/react
      - run: npm test --workspace @clndr-pro/sdk --workspace @clndr-pro/react
      # sdk first: @clndr-pro/react pins its exact version. A version that's
      # already on npm is skipped, so a half-finished release can be re-run.
      - name: Publish
        run: |
          for pkg in sdk react; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm, skipping"
            else
              npm publish --workspace "$name" --access public --provenance
            fi
          done
